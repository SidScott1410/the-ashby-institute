<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="20" cy="20" r="17" stroke="#2C3E6B" stroke-width="2" fill="none"/>
  <!-- Inner concentric circle — smaller radius for clear gap -->
  <circle cx="20" cy="20" r="10" stroke="#2C3E6B" stroke-width="1.5" fill="none"/>
  <!-- Small upward triangle at 12 o'clock, sitting just inside outer ring -->
  <polygon points="20,2 22.5,7 17.5,7" fill="#2C3E6B"/>
</svg>
